name: Verify app
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: python -m pip install -r app/requirements.txt
      - name: Regression tests
        working-directory: app
        env:
          SUPABASE_URL: https://deployment-smoke-test.supabase.co
          SUPABASE_KEY: deployment-smoke-test-placeholder
        run: python -m unittest discover -s tests -v
      - name: Streamlit Cloud smoke checks
        run: python scripts/verify_cloud.py
